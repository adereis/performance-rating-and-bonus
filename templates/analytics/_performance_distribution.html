{# Performance Distribution Card - Always visible #}
<!-- 6. Performance Distribution -->
<div class="card" data-card-id="performance-distribution">
    <div class="card-header" onclick="toggleCard(this)">
        <h2><svg class="icon"><use href="#i-chart-bar"></use></svg> Performance Distribution</h2>
        <span class="collapse-icon">▼</span>
    </div>
    <div class="card-body">
    <div class="charts-grid">
        <div class="chart-container">
            <h3>Rating Distribution</h3>
            <canvas id="ratingChart"></canvas>
        </div>
        <div class="chart-container">
            <h3>Average by Supervisory Organization</h3>
            <canvas id="departmentChart"></canvas>
        </div>
        <div class="chart-container">
            <h3>Average by Job Profile</h3>
            <canvas id="jobChart"></canvas>
        </div>
    </div>
    </div>
</div>
