{# Period-over-Period Comparison Card - Always visible, hidden via JS if no periods #}
<!-- 7. Period-over-Period Comparison -->
<div class="card" id="periodComparisonCard" data-card-id="period-comparison">
    <div class="card-header" onclick="toggleCard(this)">
        <h2><svg class="icon"><use href="#i-trending-up"></use></svg> Period-over-Period Comparison</h2>
        <span class="collapse-icon">▼</span>
    </div>
    <div class="card-body">

    <div class="comparison-header">
        <label for="periodSelect" style="font-weight: 600; color: var(--slate);">Compare current ratings with:</label>
        <select id="periodSelect" onchange="loadPeriodComparison()">
            <option value="">Select a historical period...</option>
        </select>
    </div>

    <div id="comparisonContent">
        <div class="comparison-empty">
            <p>Select a historical period above to compare ratings.</p>
            <p class="u-faint" style="font-size: 12px; margin-top: 10px;">
                Historical data is available after archiving periods from the Dashboard.
            </p>
        </div>
    </div>
    </div>
</div>
